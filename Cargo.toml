[package]
name = "thermal-probe"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "thermal-probe"

[lib]
name = "thermal_core"
path = "src/lib.rs"


[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false, optional = true }
thz_runtime_rs = { path = "toolchain/thz-runtime-rs" }

[features]
default = ["desktop-gui", "serial"]
desktop-gui = ["dep:eframe", "dep:rfd", "dep:serialport"]
serial = ["dep:serialport"]

[[bin]]
name = "thermal-probe"
path = "src/next.rs"
required-features = ["serial"]

[[bin]]
name = "thz-thermalkit"
path = "src/desktop.rs"
required-features = ["desktop-gui"]
